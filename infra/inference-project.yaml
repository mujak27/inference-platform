apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: inference
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Single-namespace inference workloads from this repository
  sourceRepos:
    - https://github.com/mujak27/inference-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: inference
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: inference.networking.k8s.io
      kind: InferencePool
