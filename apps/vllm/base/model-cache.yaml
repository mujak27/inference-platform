apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # Provisioned by the existing local-path service; retained independently of Argo.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
