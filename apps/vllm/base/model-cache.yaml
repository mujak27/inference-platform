apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  # Uses the cluster default StorageClass; verify provisioner and capacity first.
  resources:
    requests:
      storage: 20Gi
